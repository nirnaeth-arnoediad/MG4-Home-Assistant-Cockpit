      and trigger.from_state is not none and trigger.from_state.state != trigger.to_state.state }}'
  action:
  - action: input_text.set_value
    target:
      entity_id: input_text.mg4_yolcu_koltuk_sonuc
    data:
      value: 'ℹ️ Yolcu koltuk ısıtma: Yeni bildirilen durum: {{ trigger.to_state.state }}. (Araç verisi)'
- id: mg4_sarj_siniri_durum_bildirimi
