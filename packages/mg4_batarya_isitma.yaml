  mode: queued
  trigger:
  - platform: state
    entity_id: number.YOUR_VIN_target_soc
  condition:
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.to_state.state not in [''unknown'',''unavailable'']
      and trigger.from_state is not none and trigger.from_state.state != trigger.to_state.state }}'
  action:
  - action: input_text.set_value
    target:
      entity_id: input_text.mg4_sarj_siniri_sonuc
    data:
      value: 'ℹ️ Hedef şarj seviyesi: Yeni bildirilen durum: {{ trigger.to_state.state }}. (Araç verisi)'
- id: mg4_akim_limiti_durum_bildirimi
  alias: MG4 – Şarj akım limiti durum güncellemesi
  mode: queued
  trigger:
  - platform: state
    entity_id: select.YOUR_VIN_charge_current_limit
  condition:
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.to_state.state not in [''unknown'',''unavailable'']
      and trigger.from_state is not none and trigger.from_state.state != trigger.to_state.state }}'
  action:
  - action: input_text.set_value
    target:
      entity_id: input_text.mg4_akim_limiti_sonuc
    data:
      value: 'ℹ️ Şarj akım limiti: Yeni bildirilen durum: {{ trigger.to_state.state }}. (Araç verisi)'
- id: mg4_sarj_plan_durum_bildirimi
  alias: MG4 – Şarj planlama modu durum güncellemesi
  mode: queued
  trigger:
  - platform: state
    entity_id: select.YOUR_VIN_scheduled_charging_mode
  condition:
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.to_state.state not in [''unknown'',''unavailable'']
      and trigger.from_state is not none and trigger.from_state.state != trigger.to_state.state }}'
  action:
  - action: input_text.set_value
    target:
      entity_id: input_text.mg4_sarj_plan_sonuc
    data:
      value: 'ℹ️ Şarj planlama modu: Yeni bildirilen durum: {{ trigger.to_state.state }}. (Araç verisi)'
- id: mg4_isitma_plan_durum_bildirimi
  alias: MG4 – Batarya ısıtma planı durum güncellemesi
  mode: queued
  trigger:
  - platform: state
    entity_id: select.YOUR_VIN_scheduled_battery_heating
  condition:
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.to_state.state not in [''unknown'',''unavailable'']
      and trigger.from_state is not none and trigger.from_state.state != trigger.to_state.state }}'
  action:
  - action: input_text.set_value
    target:
      entity_id: input_text.mg4_isitma_plan_sonuc
    data:
      value: 'ℹ️ Batarya ısıtma planı: Yeni bildirilen durum: {{ trigger.to_state.state }}. (Araç verisi)'
- id: mg4_soket_kilidi_durum_bildirimi
  alias: MG4 – Şarj soketi kilidi durum güncellemesi
  mode: queued
  trigger:
  - platform: state
    entity_id: lock.YOUR_VIN_charging_cable_lock
  condition:
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.to_state.state not in [''unknown'',''unavailable'']
      and trigger.from_state is not none and trigger.from_state.state != trigger.to_state.state }}'
  action:
  - action: input_text.set_value
    target:
      entity_id: input_text.mg4_soket_kilidi_sonuc
    data:
      value: 'ℹ️ Şarj soketi kilidi: Yeni bildirilen durum: {{ trigger.to_state.state }}. (Araç verisi)'
- id: mg4_tek_bildirim_goster
  alias: MG4 – İşlem sonucunu tek bildirimde göster
  mode: queued
  triggers:
  - trigger: state
    entity_id:
    - input_text.mg4_batarya_isitma_sonuc
    - input_text.mg4_sarj_sonuc
    - input_text.mg4_fan_sonuc
    - input_text.mg4_on_cam_sonuc
    - input_text.mg4_arka_cam_sonuc
    - input_text.mg4_klima_sonuc
    - input_text.mg4_surucu_koltuk_sonuc
    - input_text.mg4_yolcu_koltuk_sonuc
    - input_text.mg4_sarj_siniri_sonuc
    - input_text.mg4_akim_limiti_sonuc
    - input_text.mg4_sarj_plan_sonuc
    - input_text.mg4_isitma_plan_sonuc
    - input_text.mg4_soket_kilidi_sonuc
  conditions:
  - condition: template
    value_template: '{{ trigger.to_state is not none and trigger.to_state.state not in [''unknown'',''unavailable'','''']
      and trigger.from_state is not none and trigger.from_state.state != trigger.to_state.state }}'
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.mg4_son_bildirim
    data:
      value: '{{ trigger.to_state.state[:255] }}'
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.mg4_bildirim_goster
input_boolean:
  mg4_bildirim_goster:
    name: MG4 işlem bildirimi görünür
    icon: mdi:message-alert
