    - type: markdown
      grid_options:
        columns: full
      content: "{%- macro tr_sure(t) -%}\n{%- set saniye = [0, (as_timestamp(now()) - as_timestamp(t, as_timestamp(now())))\
        \ | int] | max -%}\n{%- if saniye < 60 -%}az önce\n{%- elif saniye < 3600 -%}{{ saniye // 60 }} dakika önce\n\
        {%- elif saniye < 86400 -%}{{ saniye // 3600 }} saat önce\n{%- elif saniye < 2592000 -%}{{ saniye // 86400\
        \ }} gün önce\n{%- elif saniye < 31536000 -%}{{ saniye // 2592000 }} ay önce\n{%- else -%}{{ saniye // 31536000\
        \ }} yıl önce\n{%- endif -%}\n{%- endmacro -%}\n<div style=\"display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;\"\
        >\n  <div><span style=\"font-size:21px;font-weight:700\">\U0001F698 MG4 Luxury</span><div style=\"opacity:.7;font-size:12px;margin-top:4px\"\
        >Son bilinen araç konumu</div></div>\n  <div style=\"text-align:right\"><div style=\"font-size:13px;font-weight:600\"\
        >{% set s = states('device_tracker.lsjwh4096pn255997_vehicle_position') %}{% if s in ['unknown','unavailable']\
        \ %}⚪ Konum bilinmiyor{% else %}\U0001F7E2 Konum kaydı mevcut{% endif %}</div><div style=\"font-size:12px;opacity:.75;margin-top:4px\"\
        >{% set t = states.device_tracker.lsjwh4096pn255997_vehicle_position %}{% if t is defined %}Son durum: {{\
        \ tr_sure(t.last_updated) }}{% else %}Son güncelleme bilinmiyor{% endif %}</div></div>\n</div>"
      card_mod:
        style: ha-card {border-radius:18px!important;padding:3px 6px!important;border:1px solid var(--divider-color);box-shadow:none;}
    - type: custom:ha-openfreemap-card
