title: MG4 Cockpit V5.6 · Üç yeni analiz
views:
- title: Kokpit
  path: kokpit
  icon: mdi:car-electric
  type: sections
  max_columns: 1
  sections:
  - type: grid
    cards:
    - type: heading
      heading: MG4 Luxury · 2023
      heading_style: title
    - type: conditional
      conditions:
      - entity: input_boolean.mg4_bildirim_goster
        state: 'on'
      grid_options:
        columns: full
      card:
        type: custom:button-card
        entity: input_text.mg4_son_bildirim
        show_icon: true
        icon: mdi:message-check-outline
        show_name: true
        name: MG4 · İşlem bildirimi  ·  Kapatmak için dokun
        show_state: true
        show_label: false
        tap_action:
          action: call-service
          service: input_boolean.turn_off
          service_data:
            entity_id: input_boolean.mg4_bildirim_goster
        hold_action:
          action: none
        styles:
          card:
          - padding: 16px
          - border-radius: 18px
          - background: linear-gradient(115deg,rgba(27,43,54,.98),rgba(18,25,32,.98))
          - border: 1px solid rgba(99,219,177,.5)
          - box-shadow: 0 8px 24px rgba(0,0,0,.2)
          - color: '#f4f7fa'
          grid:
          - grid-template-areas: '"i n" "i s"'
          - grid-template-columns: 34px minmax(0,1fr)
          - grid-template-rows: auto auto
          - column-gap: 10px
          - row-gap: 6px
          icon:
          - color: '#63dbb1'
          - width: 25px
          name:
          - font-size: 12px
          - font-weight: '600'
          - opacity: '0.7'
          - justify-self: start
          - white-space: normal
          - text-align: left
          state:
          - font-size: 14px
          - white-space: normal
          - overflow: visible
          - text-overflow: clip
          - word-break: break-word
          - text-align: left
          - justify-self: stretch
    - type: custom:button-card
      entity: sensor.lsjwh4096pn255997_soc
      triggers_update:
      - sensor.lsjwh4096pn255997_soc
      - binary_sensor.lsjwh4096pn255997_battery_charging
      show_icon: false
      show_name: false
      show_state: false
      styles:
        card:
        - border-radius: 20px
        - padding: 20px
        - background: linear-gradient(135deg,#1b2934,#10171f)
        - color: white
        - box-shadow: none
        grid:
        - grid-template-areas: '"label label" "soc range" "bar bar"'
        - grid-template-columns: 1fr 1fr
        - grid-template-rows: auto auto auto
        - column-gap: 10px
        - row-gap: 12px
        custom_fields:
          label:
          - grid-area: label
          - justify-self: start
          - font-size: 12px
          - letter-spacing: 1.5px
          - opacity: '0.7'
          soc:
          - grid-area: soc
          - justify-self: start
          - font-size: 40px
          - font-weight: '700'
          - line-height: '1.1'
          range:
          - grid-area: range
          - justify-self: end
          - align-self: end
          - font-size: 17px
          bar:
          - grid-area: bar
          - width: 100%
      custom_fields:
        label: BATARYA DURUMU
        soc: '[[[ const n=Number(entity?.state); return Number.isFinite(n) && ![''unknown'',''unavailable''].includes(entity?.state)
          ? n.toFixed(1)+''%'' : ''—''; ]]]'
        range: '[[[ const s=states[''sensor.lsjwh4096pn255997_range'']; return s && ![''unknown'',''unavailable''].includes(s.state)
          ? Math.round(Number(s.state))+'' km'' : ''— km''; ]]]'
        bar: "[[[\n  const raw = entity?.state;\n  const value = Number(raw);\n  const valid = raw !== undefined\
          \ && !['unknown', 'unavailable', 'none', ''].includes(raw) && Number.isFinite(value);\n  const pct = valid\
          \ ? Math.max(0, Math.min(100, value)) : 0;\n  const charging = states['binary_sensor.lsjwh4096pn255997_battery_charging']?.state\
          \ === 'on';\n  const animation = charging ? 'mg4-charge-flow 1.8s linear infinite' : 'none';\n  return\
          \ `<style>\n    @keyframes mg4-charge-flow {\n      from { transform: translateX(-110%); }\n      to {\
          \ transform: translateX(340%); }\n    }\n  </style>\n  <div style=\"height:10px;background:#34434e;border-radius:20px;overflow:hidden;width:100%\"\
          >\n    <div style=\"height:100%;width:${pct}%;background:#63dbb1;border-radius:20px;position:relative;overflow:hidden\"\
          >\n      <div style=\"display:${charging ? 'block' : 'none'};position:absolute;inset:0;width:32%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);animation:${animation};pointer-events:none\"\
          ></div>\n    </div>\n  </div>`;\n]]]"
    - type: picture
      image: /api/image/serve/705c26700f9a7e6ed460bbe4011c54cf/original
    - type: custom:mushroom-template-card
      primary: '{% if is_state(''binary_sensor.lsjwh4096pn255997_vehicle_running'',''on'') %}Araç çalışıyor{% elif
        is_state(''binary_sensor.lsjwh4096pn255997_vehicle_running'',''off'') %}Araç park halinde{% else %}Araç
        durumu bilinmiyor{% endif %}'
      secondary: '{%- macro tr_sure(t) -%}

        {%- set saniye = [0, (as_timestamp(now()) - as_timestamp(t, as_timestamp(now()))) | int] | max -%}

        {%- if saniye < 60 -%}az önce

        {%- elif saniye < 3600 -%}{{ saniye // 60 }} dakika önce

        {%- elif saniye < 86400 -%}{{ saniye // 3600 }} saat önce

        {%- elif saniye < 2592000 -%}{{ saniye // 86400 }} gün önce

        {%- elif saniye < 31536000 -%}{{ saniye // 2592000 }} ay önce

        {%- else -%}{{ saniye // 31536000 }} yıl önce

        {%- endif -%}

        {%- endmacro -%}

        {% if is_state(''binary_sensor.lsjwh4096pn255997_charger_connected'',''on'') %}Şarj kablosu bağlı{% elif
        is_state(''binary_sensor.lsjwh4096pn255997_charger_connected'',''off'') %}Şarj kablosu bağlı değil{% else
        %}Kablo durumu bilinmiyor{% endif %} · Son veri: {{ tr_sure(states.sensor.lsjwh4096pn255997_last_vehicle_state.last_changed)
        if states.sensor.lsjwh4096pn255997_last_vehicle_state is defined else ''bilinmiyor'' }}'
      icon: mdi:car-electric
      icon_color: '{{ ''green'' if is_state(''binary_sensor.lsjwh4096pn255997_vehicle_running'',''on'') else ''blue''
        }}'
      grid_options:
        columns: full
      fill_container: true
      multiline_secondary: true
      card_mod:
        style:
          mushroom-state-info$: '.container { align-items: center !important; }

            .primary, .secondary { text-align: center !important; }

            '
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:mushroom-template-card
        entity: lock.lsjwh4096pn255997_doors_lock
        primary: Kapı kilidi
        secondary: '{% if is_state(''lock.lsjwh4096pn255997_doors_lock'',''locked'') %}Kilitli{% elif is_state(''lock.lsjwh4096pn255997_doors_lock'',''unlocked'')
          %}Kilit açık{% else %}Durum bilinmiyor{% endif %}'
        icon: '{% if is_state(''lock.lsjwh4096pn255997_doors_lock'',''locked'') %}mdi:lock{% elif is_state(''lock.lsjwh4096pn255997_doors_lock'',''unlocked'')
          %}mdi:lock-open-variant{% else %}mdi:lock-question{% endif %}'
        icon_color: '{% if is_state(''lock.lsjwh4096pn255997_doors_lock'',''locked'') %}green{% elif is_state(''lock.lsjwh4096pn255997_doors_lock'',''unlocked'')
          %}red{% else %}disabled{% endif %}'
        tap_action:
          action: more-info
        hold_action:
          action: more-info
        card_mod:
          style: 'ha-card { background: {% if is_state(''lock.lsjwh4096pn255997_doors_lock'', ''locked'') %}rgba(22,163,74,.19){%
            elif is_state(''lock.lsjwh4096pn255997_doors_lock'', ''unlocked'') %}rgba(220,38,38,.17){% else %}var(--ha-card-background,var(--card-background-color)){%
            endif %} !important; border: 1px solid {% if is_state(''lock.lsjwh4096pn255997_doors_lock'', ''locked'')
            %}rgba(74,222,128,.75){% elif is_state(''lock.lsjwh4096pn255997_doors_lock'', ''unlocked'') %}rgba(248,113,113,.75){%
            else %}var(--divider-color){% endif %} !important; border-radius: 16px !important; transition: background
            .25s ease, border-color .25s ease; }'
      - type: custom:mushroom-template-card
        entity: lock.lsjwh4096pn255997_boot_lock
        primary: Bagaj kilidi
        secondary: '{% if is_state(''lock.lsjwh4096pn255997_boot_lock'',''locked'') %}Kilitli{% elif is_state(''lock.lsjwh4096pn255997_boot_lock'',''unlocked'')
          %}Kilit açık{% else %}Durum bilinmiyor{% endif %}'
        icon: '{% if is_state(''lock.lsjwh4096pn255997_boot_lock'',''locked'') %}mdi:lock{% elif is_state(''lock.lsjwh4096pn255997_boot_lock'',''unlocked'')
          %}mdi:lock-open-variant{% else %}mdi:lock-question{% endif %}'
        icon_color: '{% if is_state(''lock.lsjwh4096pn255997_boot_lock'',''locked'') %}green{% elif is_state(''lock.lsjwh4096pn255997_boot_lock'',''unlocked'')
          %}red{% else %}disabled{% endif %}'
        tap_action:
          action: more-info
        hold_action:
          action: more-info
        card_mod:
          style: 'ha-card { background: {% if is_state(''lock.lsjwh4096pn255997_boot_lock'', ''locked'') %}rgba(22,163,74,.19){%
            elif is_state(''lock.lsjwh4096pn255997_boot_lock'', ''unlocked'') %}rgba(220,38,38,.17){% else %}var(--ha-card-background,var(--card-background-color)){%
            endif %} !important; border: 1px solid {% if is_state(''lock.lsjwh4096pn255997_boot_lock'', ''locked'')
            %}rgba(74,222,128,.75){% elif is_state(''lock.lsjwh4096pn255997_boot_lock'', ''unlocked'') %}rgba(248,113,113,.75){%
            else %}var(--divider-color){% endif %} !important; border-radius: 16px !important; transition: background
            .25s ease, border-color .25s ease; }'
      - type: custom:mushroom-template-card
        entity: switch.lsjwh4096pn255997_charging
        primary: Şarj kontrolü
        secondary: '{% if is_state(''switch.lsjwh4096pn255997_charging'', ''on'') %}Aktif{% else %}Pasif{% endif
          %}'
        icon: mdi:toggle-switch
        icon_color: '{% if is_state(''switch.lsjwh4096pn255997_charging'', ''on'') %}red{% else %}disabled{% endif
          %}'
        tap_action:
          action: call-service
          service: script.mg4_sarj_geri_bildirim
        hold_action:
          action: more-info
        card_mod:
          style: 'ha-card { background: {% if is_state(''switch.lsjwh4096pn255997_charging'', ''on'') %}rgba(220,38,38,0.16){%
            else %}var(--ha-card-background,var(--card-background-color)){% endif %}; border: 1px solid {% if is_state(''switch.lsjwh4096pn255997_charging'',
            ''on'') %}rgba(239,68,68,0.65){% else %}var(--divider-color){% endif %}; border-radius: 16px; }'
      - type: custom:mushroom-template-card
        entity: switch.lsjwh4096pn255997_battery_heating
        primary: Batarya ısıtma
        secondary: '{% if is_state(''switch.lsjwh4096pn255997_battery_heating'',''on'') %}Aktif{% elif is_state(''switch.lsjwh4096pn255997_battery_heating'',''off'')
          %}Pasif{% else %}Durum bilinmiyor{% endif %}'
        icon: mdi:toggle-switch
        icon_color: '{{ ''red'' if is_state(''switch.lsjwh4096pn255997_battery_heating'', ''on'') else ''disabled''
          }}'
        tap_action:
          action: call-service
          service: script.mg4_batarya_isitma_geri_bildirim
        hold_action:
          action: more-info
        card_mod:
          style: "ha-card {\n  background: {% if is_state('switch.lsjwh4096pn255997_battery_heating','on') %}rgba(220,38,38,.17){%\
            \ else %}var(--ha-card-background,var(--card-background-color)){% endif %} !important;\n  border: 1px\
            \ solid {% if is_state('switch.lsjwh4096pn255997_battery_heating','on') %}rgba(248,113,113,.75){% else\
            \ %}var(--divider-color){% endif %} !important;\n  border-radius: 16px !important;\n  transition: background\
            \ .25s ease, border-color .25s ease;\n}"
    - type: grid
      columns: 2
      square: false
      cards:
      - type: tile
        entity: sensor.lsjwh4096pn255997_interior_temperature
        name: Kabin
        card_mod:
          style: 'ha-card { border-radius: 18px !important; border: 1px solid var(--divider-color); box-shadow:
            0 4px 18px rgba(0,0,0,.09); overflow: hidden; }'
      - type: tile
        entity: sensor.lsjwh4096pn255997_exterior_temperature
        name: Dış ortam
        card_mod:
          style: 'ha-card { border-radius: 18px !important; border: 1px solid var(--divider-color); box-shadow:
            0 4px 18px rgba(0,0,0,.09); overflow: hidden; }'
    - type: entities
      title: Araç özeti
      show_header_toggle: false
      entities:
      - entity: sensor.lsjwh4096pn255997_mileage
        name: Toplam kilometre
      - entity: sensor.lsjwh4096pn255997_auxiliary_battery_voltage
        name: 12V akü gerilimi
      - entity: sensor.lsjwh4096pn255997_soc_kwh
        name: Bataryadaki enerji (kWh)
      card_mod:
        style: 'ha-card { border-radius: 18px !important; border: 1px solid var(--divider-color); box-shadow: 0
          4px 18px rgba(0,0,0,.09); overflow: hidden; }'
- title: Enerji
  path: enerji
  icon: mdi:lightning-bolt
  type: sections
  max_columns: 1
  sections:
  - type: grid
    cards:
    - type: conditional
      conditions:
      - entity: input_boolean.mg4_bildirim_goster
        state: 'on'
      grid_options:
        columns: full
      card:
        type: custom:button-card
        entity: input_text.mg4_son_bildirim
        show_icon: true
        icon: mdi:message-check-outline
        show_name: true
        name: MG4 · İşlem bildirimi  ·  Kapatmak için dokun
        show_state: true
        show_label: false
        tap_action:
          action: call-service
          service: input_boolean.turn_off
          service_data:
            entity_id: input_boolean.mg4_bildirim_goster
        hold_action:
          action: none
        styles:
          card:
          - padding: 16px
          - border-radius: 18px
          - background: linear-gradient(115deg,rgba(27,43,54,.98),rgba(18,25,32,.98))
          - border: 1px solid rgba(99,219,177,.5)
          - box-shadow: 0 8px 24px rgba(0,0,0,.2)
          - color: '#f4f7fa'
          grid:
          - grid-template-areas: '"i n" "i s"'
          - grid-template-columns: 34px minmax(0,1fr)
          - grid-template-rows: auto auto
          - column-gap: 10px
          - row-gap: 6px
          icon:
          - color: '#63dbb1'
          - width: 25px
          name:
          - font-size: 12px
          - font-weight: '600'
          - opacity: '0.7'
          - justify-self: start
          - white-space: normal
          - text-align: left
          state:
          - font-size: 14px
          - white-space: normal
          - overflow: visible
          - text-overflow: clip
          - word-break: break-word
          - text-align: left
          - justify-self: stretch
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.epias_guncel_ptf_kwh_2
        state_not: unavailable
      - condition: state
        entity: sensor.epias_guncel_ptf_kwh_2
        state_not: unknown
      card:
        type: grid
        columns: 2
        square: false
        grid_options:
          columns: full
        cards:
        - type: custom:mushroom-template-card
          entity: sensor.epias_guncel_ptf_kwh_2
          primary: Güncel PTF
          secondary: '{% set s = states(''sensor.epias_guncel_ptf_kwh_2'') %}

            {% if is_number(s) %}

            {{ ''%.3f TL/kWh'' | format(s | float) }}

            {% set t = as_local(states.sensor.epias_guncel_ptf_kwh_2.last_updated) %}

            {{ t.strftime(''%d.%m.%Y'') }} · {{ t.strftime(''%H:00'') }}–{{ (t + timedelta(hours=1)).strftime(''%H:00'')
            }}

            {% else %}Veri bekleniyor{% endif %}'
          icon: mdi:chart-line
          icon_color: cyan
          tap_action:
            action: more-info
          card_mod:
            style: 'ha-card { border-radius: 16px; }'
          multiline_secondary: true
        - type: custom:mushroom-template-card
          entity: sensor.epias_guncel_ptf_kwh_2
          primary: Tahmini toplam fiyat
          secondary: '{% set p = states(''sensor.epias_guncel_ptf_kwh_2'') %}{% if is_number(p) %}{{ ''%.2f TL/kWh''
            | format((((p | float + 0.48886) * 1.0495 * 1.05) + 2.4249) * 1.10) }}{% else %}Veri bekleniyor{% endif
            %}'
          icon: mdi:cash-multiple
          icon_color: green
          tap_action:
            action: more-info
          card_mod:
            style: 'ha-card { border-radius: 16px; }'
    - type: conditional
      conditions:
      - condition: state
        entity: sensor.epias_guncel_ptf_kwh_2
        state_not: unavailable
      - condition: state
        entity: sensor.epias_guncel_ptf_kwh_2
        state_not: unknown
      card:
        type: markdown
        content: '<small>Tahmini toplam: YEKDEM 0,48886 + %4,95 tedarikçi payı + 2,4249 TL/kWh dağıtım + %5 BTV
          + %10 KDV. Bu değerler varsayımsaldır; sözleşme ve güncel tarifeyle doğrulanmalıdır.</small>'
        grid_options:
          columns: full
    - type: heading
      heading: Şarj · Kontroller ve canlı durum
      heading_style: title
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:mushroom-template-card
        entity: switch.lsjwh4096pn255997_charging
        primary: Şarj başlat / durdur
        secondary: '{% if is_state(''switch.lsjwh4096pn255997_charging'', ''on'') %}Aktif{% else %}Pasif{% endif
          %}'
        icon: mdi:ev-station
        icon_color: '{% if is_state(''switch.lsjwh4096pn255997_charging'', ''on'') %}red{% else %}disabled{% endif
          %}'
        tap_action:
          action: call-service
          service: script.mg4_sarj_geri_bildirim
        hold_action:
          action: more-info
        card_mod:
          style: 'ha-card { background: {% if is_state(''switch.lsjwh4096pn255997_charging'', ''on'') %}rgba(220,38,38,0.16){%
            else %}var(--ha-card-background,var(--card-background-color)){% endif %}; border: 1px solid {% if is_state(''switch.lsjwh4096pn255997_charging'',
            ''on'') %}rgba(239,68,68,0.65){% else %}var(--divider-color){% endif %}; border-radius: 16px; }'
      - type: custom:mushroom-template-card
        entity: lock.lsjwh4096pn255997_charging_cable_lock
        primary: Şarj soketi kilidi
        secondary: '{% if is_state(''lock.lsjwh4096pn255997_charging_cable_lock'',''locked'') %}Kilitli{% elif is_state(''lock.lsjwh4096pn255997_charging_cable_lock'',''unlocked'')
          %}Kilit açık{% else %}Durum bilinmiyor{% endif %}'
        icon: mdi:lock-outline
        icon_color: '{% if is_state(''lock.lsjwh4096pn255997_charging_cable_lock'',''locked'') %}green{% elif is_state(''lock.lsjwh4096pn255997_charging_cable_lock'',''unlocked'')
          %}red{% else %}disabled{% endif %}'
        tap_action:
          action: more-info
        hold_action:
          action: more-info
        card_mod:
          style: 'ha-card { background: {% if is_state(''lock.lsjwh4096pn255997_charging_cable_lock'', ''locked'')
            %}rgba(22,163,74,.19){% elif is_state(''lock.lsjwh4096pn255997_charging_cable_lock'', ''unlocked'')
            %}rgba(220,38,38,.17){% else %}var(--ha-card-background,var(--card-background-color)){% endif %} !important;
            border: 1px solid {% if is_state(''lock.lsjwh4096pn255997_charging_cable_lock'', ''locked'') %}rgba(74,222,128,.75){%
            elif is_state(''lock.lsjwh4096pn255997_charging_cable_lock'', ''unlocked'') %}rgba(248,113,113,.75){%
            else %}var(--divider-color){% endif %} !important; border-radius: 16px !important; transition: background
            .25s ease, border-color .25s ease; }'
      grid_options:
        columns: full
    - type: markdown
      content: '{% set cable = states(''binary_sensor.lsjwh4096pn255997_charger_connected'') %}

        {% set active = states(''binary_sensor.lsjwh4096pn255997_battery_charging'') %}

        {% set command = states(''switch.lsjwh4096pn255997_charging'') %}

        {% if cable in [''unknown'',''unavailable''] or active in [''unknown'',''unavailable''] %}

        **ℹ️ Şarj durumu doğrulanamıyor.** Araçtan güncel bilgi bekleniyor.

        {% elif active == ''on'' %}

        **🟢 Şarj devam ediyor.** Araç bataryanın şarj edildiğini bildiriyor.

        {% elif cable == ''off'' %}

        **🔌 Şarj kablosu takılı değil.** Şarj başlatmak için kabloyu bağlayın.

        {% elif command == ''on'' %}

        **🟠 Şarj başlatma isteği açık, ancak şarj henüz başlamamış.** Araç durumunu, şarj sınırını ve planlamayı
        kontrol edin.

        {% else %}

        **ℹ️ Kablo takılı, şarj yapılmıyor.** Şarjı başlatabilir veya planlanan saati bekleyebilirsiniz.

        {% endif %}'
      card_mod:
        style: 'ha-card {border-radius: 14px !important; border: 1px solid var(--divider-color); box-shadow: none;
          padding: 2px 4px; }'
      grid_options:
        columns: full
    - type: grid
      columns: 2
      square: false
      cards:
      - type: tile
        entity: number.lsjwh4096pn255997_target_soc
        name: Şarj sınırı (%)
        icon: mdi:battery-charging-80
        vertical: false
        features_position: bottom
        features:
        - type: numeric-input
          style: buttons
      - type: tile
        entity: select.lsjwh4096pn255997_charge_current_limit
        name: Şarj akımı
        icon: mdi:current-ac
        vertical: false
        features_position: bottom
        features:
        - type: select-options
        card_mod:
          style: 'ha-card { border-radius: 14px; border: 1px solid var(--divider-color); box-shadow: none; }'
      grid_options:
        columns: full
    - type: entities
      title: Anlık şarj bilgileri
      show_header_toggle: false
      entities:
      - entity: sensor.mg4_tr_charger_connected
        name: Şarj kablosu takılı mı?
      - entity: sensor.mg4_tr_battery_charging
        name: Şarj devam ediyor mu?
      - entity: sensor.lsjwh4096pn255997_power
