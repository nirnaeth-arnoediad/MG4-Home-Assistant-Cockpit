        dış sıcaklığıyla karşılaştır. Bu grafik yalnızca yeni tamamlanan sürüşlerde değişir; ara zamanlardaki yatay
        çizgiler yeni ölçüm değildir. **Sıcaklık etkisi** için benzer rota, hız ve klima koşullarında birden fazla
        sürüş gerekir. 30 saniyelik mevcut API aralığı değiştirilmez.'
    - type: heading
