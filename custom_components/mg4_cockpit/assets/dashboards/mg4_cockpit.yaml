- title: Sistem
  path: sistem
  icon: mdi:cog-outline
  type: sections
  max_columns: 1
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Sistem · Bağlantı ve veri durumu
      heading_style: title
    - type: markdown
      content: "{%- macro tr_sure(t) -%}\n{%- set saniye = [0, (as_timestamp(now()) - as_timestamp(t, as_timestamp(now())))\
        \ | int] | max -%}\n{%- if saniye < 60 -%}az önce\n{%- elif saniye < 3600 -%}{{ saniye // 60 }} dakika önce\n\
        {%- elif saniye < 86400 -%}{{ saniye // 3600 }} saat önce\n{%- elif saniye < 2592000 -%}{{ saniye // 86400\
        \ }} gün önce\n{%- elif saniye < 31536000 -%}{{ saniye // 2592000 }} ay önce\n{%- else -%}{{ saniye // 31536000\
        \ }} yıl önce\n{%- endif -%}\n{%- endmacro -%}\n### Son veri ve komut durumu\n\n{% set sensors = [\n  ('\U0001F697\
        \ Son araç verisi', 'sensor.mg4_tr_last_vehicle_state'),\n  ('⚡ Son şarj verisi', 'sensor.mg4_tr_last_charge_state'),\n\
        \  ('\U0001F552 Son araç etkinliği', 'sensor.mg4_tr_last_car_activity')\n] %}\n{% for label, entity in sensors\
        \ %}\n{% set raw = states(entity) %}\n{% set dt = as_datetime(raw, none) %}\n**{{ label }}:** {% if dt is\
        \ not none %}{{ tr_sure(dt) }}{% elif raw in ['unknown','unavailable','none',''] %}Bilinmiyor{% else %}{{\
        \ raw }}{% endif %}  \n{% endfor %}\n{% set poll = states.sensor.mg4_tr_last_poll_error %}\n**⚠️ Son veri\
        \ sorgulama hatası:** {% if poll is none or poll.state in ['unknown','unavailable','none',''] %}Bilinmiyor{%\
        \ elif poll.state | lower in ['ok','none','no error','yok','false','0'] %}Hata yok{% else %}{{ tr_sure(poll.last_changed)\
        \ }}{% endif %}  \n{% set cmd = states['event.lsjwh4096pn255997_command_error'] %}\n{% set cmd_time = as_datetime(cmd.state,\
        \ none) if cmd is not none else none %}\n**❗ Komut gönderme hatası:** {% if cmd_time is not none %}{{ tr_sure(cmd_time)\
        \ }}{% else %}Kayıt yok{% endif %}  \n{% set msg = states['event.lsjwh4096pn255997_vehicle_message'] %}\n\
        {% set msg_time = as_datetime(msg.state, none) if msg is not none else none %}\n**\U0001F4AC Araçtan gelen\
        \ bildirim:** {% if msg_time is not none %}{{ tr_sure(msg_time) }}{% else %}Kayıt yok{% endif %}\n"
      grid_options:
        columns: full
      card_mod:
        style: ha-card {border-radius:18px;border:1px solid var(--divider-color);padding:8px 10px;}
    - type: markdown
      content: '{%- macro tr_sure(t) -%}

        {%- set saniye = [0, (as_timestamp(now()) - as_timestamp(t, as_timestamp(now()))) | int] | max -%}

        {%- if saniye < 60 -%}az önce

        {%- elif saniye < 3600 -%}{{ saniye // 60 }} dakika önce

        {%- elif saniye < 86400 -%}{{ saniye // 3600 }} saat önce

        {%- elif saniye < 2592000 -%}{{ saniye // 86400 }} gün önce

        {%- elif saniye < 31536000 -%}{{ saniye // 2592000 }} ay önce

        {%- else -%}{{ saniye // 31536000 }} yıl önce

        {%- endif -%}

        {%- endmacro -%}

        ### <ha-icon icon="mdi:message-text-outline"></ha-icon> Araçtan gelen son bildirim


        {% set e = states[''event.lsjwh4096pn255997_vehicle_message''] %}

        {% set dt = as_datetime(e.state, none) if e is not none else none %}

        {% if dt is none %}

        Henüz kayıtlı araç bildirimi yok.

        {% else %}

        {% set a = e.attributes %}

        {% set body = a.get(''message'') or a.get(''description'') or a.get(''text'') or a.get(''notification'')
        or a.get(''event_type'') %}

        {% if body %}

        > {{ body | string | replace(''\n'', '' '') }}

        {% else %}

        Bildirim alındı. Ayrıntı için aşağıdaki olay kaydını açın.

        {% endif %}


        <small>Son bildirim: {{ tr_sure(dt) }}</small>

        {% endif %}

        '
      grid_options:
        columns: full
      card_mod:
        style: 'ha-card {border-radius:18px;border:1px solid rgba(99,219,177,.45);background:rgba(99,219,177,.055);padding:6px
          8px;} '
