    - type: markdown
      grid_options:
        columns: full
      content: '{% set names = [''Pzt'',''Sal'',''Çar'',''Per'',''Cum'',''Cmt'',''Paz''] %}

        **Sürüş etkinliği** · Takvim gününe göre aracın *çalışır durumda* kaldığı süre


        | Gün | Kullanım | Süre |

        |:--|:--|--:|

        {% for n in range(6,-1,-1) %}

        {% set h = states(''sensor.mg4_surus_suresi_'' ~ n ~ ''g'') | float(-1) %}

        {% set day = now() - timedelta(days=n) %}

