    - type: markdown
      grid_options:
        columns: full
      content: '{% set soguk = states(''input_number.mg4_ek_soguk_sayisi'') | int(0) %}

        {% set ilik = states(''input_number.mg4_ek_ilik_sayisi'') | int(0) %}

        **Soğuk hava tüketim farkı:** 10°C altındaki sürüşlerle 15–25°C arasındaki sürüşlerin ortalama tüketim farkını
        yüzde olarak gösterir. En az **5 soğuk + 5 ılık sürüş** gerekir.


        - Soğuk sürüş: **{{ soguk }}/5** — **{{ [5 - soguk, 0] | max }} sürüş kaldı**.

        - Ilık sürüş: **{{ ilik }}/5** — **{{ [5 - ilik, 0] | max }} sürüş kaldı**.


        **Batarya performans eğilimi:** Benzer sıcaklıklardaki sürüşlerde enerji verimliliğinin zamanla değişimini
        izler. En az **10 ılık sürüş** ve geçerli referans verisi gerekir.


        - Performans eğilimi: **{{ ilik }}/10 ılık sürüş** — **{{ [10 - ilik, 0] | max }} sürüş kaldı**.


        {% if soguk < 5 or ilik < 5 %}*Soğuk hava karşılaştırması için veri birikiyor.*{% endif %}

        {% if ilik < 10 %}*Performans eğilimi için veri birikiyor.*{% endif %}


        **Not:** Performans eğilimi gerçek batarya sağlığı (SoH) ölçümü değildir. Yeterli sürüş sayısına ulaşılması,
        geçerli tüketim ve referans verisi bulunması şartını ortadan kaldırmaz.'
