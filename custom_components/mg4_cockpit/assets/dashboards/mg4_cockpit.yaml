      fit_bounds: true
      style: auto
      light_style: positron
      dark_style: dark
      compact_attribution: true
      show_zones: false
      grid_options:
        columns: full
    - type: grid
      columns: 2
      square: false
      grid_options:
        columns: full
      cards:
      - type: tile
        entity: device_tracker.lsjwh4096pn255997_vehicle_position
        name: Araç konumu
        icon: mdi:car-marker
        tap_action:
          action: more-info
      - type: markdown
        content: '{%- macro tr_sure(t) -%}

          {%- set saniye = [0, (as_timestamp(now()) - as_timestamp(t, as_timestamp(now()))) | int] | max -%}

          {%- if saniye < 60 -%}az önce

          {%- elif saniye < 3600 -%}{{ saniye // 60 }} dakika önce

          {%- elif saniye < 86400 -%}{{ saniye // 3600 }} saat önce

          {%- elif saniye < 2592000 -%}{{ saniye // 86400 }} gün önce

          {%- elif saniye < 31536000 -%}{{ saniye // 2592000 }} ay önce

          {%- else -%}{{ saniye // 31536000 }} yıl önce

          {%- endif -%}

          {%- endmacro -%}

          **<ha-icon icon="mdi:clock-outline"></ha-icon> Son konum güncellemesi**


          {% set t = states.device_tracker.lsjwh4096pn255997_vehicle_position %}{% if t is defined %}{{ tr_sure(t.last_updated)
          }}{% else %}Bilinmiyor{% endif %}'
