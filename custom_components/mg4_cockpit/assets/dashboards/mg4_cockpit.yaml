          endif %} !important; border: 1px solid {% if is_state(''switch.lsjwh4096pn255997_find_my_car'', ''on'')
          %}rgba(74,222,128,.75){% elif is_state(''switch.lsjwh4096pn255997_find_my_car'', ''off'') %}rgba(248,113,113,.75){%
